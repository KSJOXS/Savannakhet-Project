<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Use Case Diagram - Savannakhet Smart Travel (Full System)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        h2 { margin-bottom: 10px; color: #333; }
        .btn-bar { margin-bottom: 15px; }
        .btn-bar button {
            padding: 10px 28px;
            font-size: 15px;
            background: #222;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 0 5px;
        }
        .btn-bar button:hover { background: #555; }
        canvas {
            background: #fff;
            border: 1px solid #bbb;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <h2>Sơ đồ Use Case - Hệ thống Savannakhet Smart Travel</h2>
    <div class="btn-bar">
        <button onclick="downloadPNG()">⬇ Tải xuống PNG</button>
    </div>
    <canvas id="canvas" width="1200" height="1050"></canvas>

    <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const FONT = '"Segoe UI", Arial, sans-serif';

    // ===== Drawing Helpers =====
    function drawOval(cx, cy, rx, ry, label, fontSize) {
        fontSize = fontSize || 12;
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1.6;
        ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.fill();

        ctx.fillStyle = '#000';
        ctx.font = `${fontSize}px ${FONT}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        const lines = label.split('\n');
        const lineH = fontSize + 2;
        const startY = cy - ((lines.length - 1) * lineH) / 2;
        lines.forEach((line, i) => {
            ctx.fillText(line, cx, startY + i * lineH);
        });
    }

    function drawActor(x, y, name) {
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.arc(x, y - 24, 10, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x, y - 14); ctx.lineTo(x, y + 12); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x - 14, y - 2); ctx.lineTo(x + 14, y - 2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x, y + 12); ctx.lineTo(x - 12, y + 30); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x, y + 12); ctx.lineTo(x + 12, y + 30); ctx.stroke();

        ctx.fillStyle = '#000';
        ctx.font = `bold 13px ${FONT}`;
        ctx.textAlign = 'center';

        const nameLines = name.split('\n');
        nameLines.forEach((line, i) => {
            ctx.fillText(line, x, y + 46 + i * 16);
        });
    }

    function drawSolidLine(x1, y1, x2, y2) {
        ctx.beginPath();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1.3;
        ctx.setLineDash([]);
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
    }

    function drawDashedArrow(x1, y1, x2, y2, label) {
        ctx.beginPath();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1.2;
        ctx.setLineDash([6, 3]);
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        ctx.setLineDash([]);

        const angle = Math.atan2(y2 - y1, x2 - x1);
        const headLen = 9;
        ctx.beginPath();
        ctx.moveTo(x2, y2);
        ctx.lineTo(x2 - headLen * Math.cos(angle - 0.4), y2 - headLen * Math.sin(angle - 0.4));
        ctx.moveTo(x2, y2);
        ctx.lineTo(x2 - headLen * Math.cos(angle + 0.4), y2 - headLen * Math.sin(angle + 0.4));
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1.2;
        ctx.stroke();

        if (label) {
            const mx = (x1 + x2) / 2;
            const my = (y1 + y2) / 2;
            ctx.font = `10px ${FONT}`;
            const tw = ctx.measureText(label).width;
            ctx.fillStyle = '#fff';
            ctx.fillRect(mx - tw / 2 - 2, my - 7, tw + 4, 14);
            ctx.fillStyle = '#000';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, mx, my);
        }
    }

    function drawBoundary(x, y, w, h, title) {
        ctx.beginPath();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([]);
        ctx.rect(x, y, w, h);
        ctx.stroke();
        ctx.fillStyle = '#000';
        ctx.font = `bold 14px ${FONT}`;
        ctx.textAlign = 'center';
        ctx.fillText(title, x + w / 2, y + 18);
    }

    function ovalEdge(cx, cy, rx, ry, tx, ty) {
        const angle = Math.atan2(ty - cy, tx - cx);
        return { x: cx + rx * Math.cos(angle), y: cy + ry * Math.sin(angle) };
    }

    // ===== MAIN DRAW =====
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // --- Boundary ---
        drawBoundary(170, 15, 1010, 1020, 'Hệ thống Savannakhet Smart Travel');

        // ===== OVAL SIZES =====
        const RX = 90, RY = 24;

        // ============================================================
        //  ACTOR 1: Khách không đăng nhập (Guest)
        // ============================================================
        const guest_x = 70, guest_y = 130;
        drawActor(guest_x, guest_y, 'Khách không\nđăng nhập');

        // Guest Use Cases
        const uc_register = { x: 420, y: 80 };
        const uc_viewPlaces = { x: 420, y: 150 };

        drawOval(uc_register.x, uc_register.y, RX, RY, 'Đăng ký tài khoản');
        drawOval(uc_viewPlaces.x, uc_viewPlaces.y, RX, RY, 'Xem địa điểm');

        // Guest → Use Cases (solid lines)
        let e;
        e = ovalEdge(uc_register.x, uc_register.y, RX, RY, guest_x, guest_y);
        drawSolidLine(guest_x + 14, guest_y - 2, e.x, e.y);
        e = ovalEdge(uc_viewPlaces.x, uc_viewPlaces.y, RX, RY, guest_x, guest_y);
        drawSolidLine(guest_x + 14, guest_y + 10, e.x, e.y);

        // ============================================================
        //  ACTOR 2: Người dùng (User - đã đăng nhập)
        // ============================================================
        const user_x = 70, user_y = 480;
        drawActor(user_x, user_y, 'Người dùng');

        // --- Shared: Đăng nhập ---
        const uc_login = { x: 870, y: 390 };
        drawOval(uc_login.x, uc_login.y, RX, RY, 'Đăng nhập');

        // User Use Cases
        const uc_search = { x: 420, y: 260 };
        const uc_trip = { x: 420, y: 340 };
        const uc_profile = { x: 420, y: 420 };
        const uc_community = { x: 420, y: 500 };
        const uc_favorite = { x: 420, y: 580 };
        const uc_foryou = { x: 420, y: 660 };
        const uc_contact = { x: 420, y: 740 };

        drawOval(uc_search.x, uc_search.y, RX, RY, 'Tìm kiếm địa điểm');
        drawOval(uc_trip.x, uc_trip.y, RX, RY, 'Lập lịch trình du lịch');
        drawOval(uc_profile.x, uc_profile.y, RX, RY, 'Quản lý thông tin\ncá nhân');
        drawOval(uc_community.x, uc_community.y, RX, RY, 'Đăng bài & Đánh giá\n(Community)');
        drawOval(uc_favorite.x, uc_favorite.y, RX, RY, 'Quản lý yêu thích');
        drawOval(uc_foryou.x, uc_foryou.y, RX, RY, 'Nhận gợi ý AI\n(For You)');
        drawOval(uc_contact.x, uc_contact.y, RX, RY, 'Liên hệ hỗ trợ');

        // User → Use Cases (solid lines to actor)
        const userUCs = [uc_search, uc_trip, uc_profile, uc_community, uc_favorite, uc_foryou, uc_contact];
        userUCs.forEach(uc => {
            e = ovalEdge(uc.x, uc.y, RX, RY, user_x, user_y);
            drawSolidLine(user_x + 14, user_y, e.x, e.y);
        });

        // Guest also connects to uc_viewPlaces and uc_search
        e = ovalEdge(uc_search.x, uc_search.y, RX, RY, guest_x, guest_y);
        drawSolidLine(guest_x + 14, guest_y + 20, e.x, e.y);

        // --- <<include>> to Đăng nhập (dashed from each user UC → login) ---
        const includeUCs = [uc_search, uc_trip, uc_profile, uc_community, uc_favorite, uc_foryou];
        includeUCs.forEach(uc => {
            let from = ovalEdge(uc.x, uc.y, RX, RY, uc_login.x, uc_login.y);
            let to = ovalEdge(uc_login.x, uc_login.y, RX, RY, uc.x, uc.y);
            drawDashedArrow(from.x, from.y, to.x, to.y, '<<include>>');
        });

        // ============================================================
        //  ACTOR 3: Admin
        // ============================================================
        const admin_x = 70, admin_y = 900;
        drawActor(admin_x, admin_y, 'Admin');

        // Admin Use Cases
        const uc_dashboard = { x: 420, y: 830 };
        const uc_mngPlaces = { x: 420, y: 910 };
        const uc_mngUsers = { x: 420, y: 990 };

        drawOval(uc_dashboard.x, uc_dashboard.y, RX, RY, 'Xem thống kê\n(Dashboard)');
        drawOval(uc_mngPlaces.x, uc_mngPlaces.y, RX, RY, 'Quản lý địa điểm');
        drawOval(uc_mngUsers.x, uc_mngUsers.y, RX, RY, 'Quản lý người dùng');

        // Admin → Use Cases
        const adminUCs = [uc_dashboard, uc_mngPlaces, uc_mngUsers];
        adminUCs.forEach(uc => {
            e = ovalEdge(uc.x, uc.y, RX, RY, admin_x, admin_y);
            drawSolidLine(admin_x + 14, admin_y, e.x, e.y);
        });

        // Admin → Đăng nhập (include)
        adminUCs.forEach(uc => {
            let from = ovalEdge(uc.x, uc.y, RX, RY, uc_login.x, uc_login.y);
            let to = ovalEdge(uc_login.x, uc_login.y, RX, RY, uc.x, uc.y);
            drawDashedArrow(from.x, from.y, to.x, to.y, '<<include>>');
        });

        // ============================================================
        //  <<extends>> USE CASES (ด้านขวา)
        // ============================================================
        const SRX = 82, SRY = 22;

        // --- extends from Tìm kiếm ---
        const ext_filter = { x: 700, y: 225 };
        const ext_detail = { x: 700, y: 280 };
        drawOval(ext_filter.x, ext_filter.y, SRX, SRY, 'Lọc theo danh mục', 11);
        drawOval(ext_detail.x, ext_detail.y, SRX, SRY, 'Xem chi tiết địa điểm', 11);

        [ext_filter, ext_detail].forEach(ext => {
            let from = ovalEdge(ext.x, ext.y, SRX, SRY, uc_search.x, uc_search.y);
            let to = ovalEdge(uc_search.x, uc_search.y, RX, RY, ext.x, ext.y);
            drawDashedArrow(from.x, from.y, to.x, to.y, '<<extends>>');
        });

        // --- extends from Lập lịch trình ---
        const ext_swap = { x: 700, y: 340 };
        const ext_save = { x: 700, y: 385 };
        drawOval(ext_swap.x, ext_swap.y, SRX, SRY, 'Hoán đổi địa điểm', 11);
        drawOval(ext_save.x, ext_save.y, SRX, SRY, 'Lưu lịch trình', 11);

        [ext_swap, ext_save].forEach(ext => {
            let from = ovalEdge(ext.x, ext.y, SRX, SRY, uc_trip.x, uc_trip.y);
            let to = ovalEdge(uc_trip.x, uc_trip.y, RX, RY, ext.x, ext.y);
            drawDashedArrow(from.x, from.y, to.x, to.y, '<<extends>>');
        });

        // --- extends from Quản lý thông tin cá nhân ---
        const ext_editProfile = { x: 700, y: 435 };
        const ext_resetPw = { x: 700, y: 475 };
        drawOval(ext_editProfile.x, ext_editProfile.y, SRX, SRY, 'Cập nhật hồ sơ', 11);
        drawOval(ext_resetPw.x, ext_resetPw.y, SRX, SRY, 'Đổi mật khẩu', 11);

        [ext_editProfile, ext_resetPw].forEach(ext => {
            let from = ovalEdge(ext.x, ext.y, SRX, SRY, uc_profile.x, uc_profile.y);
            let to = ovalEdge(uc_profile.x, uc_profile.y, RX, RY, ext.x, ext.y);
            drawDashedArrow(from.x, from.y, to.x, to.y, '<<extends>>');
        });

        // --- extends from Community ---
        const ext_like = { x: 700, y: 520 };
        const ext_comment = { x: 700, y: 560 };
        drawOval(ext_like.x, ext_like.y, SRX, SRY, 'Thích bài viết', 11);
        drawOval(ext_comment.x, ext_comment.y, SRX, SRY, 'Bình luận bài viết', 11);

        [ext_like, ext_comment].forEach(ext => {
            let from = ovalEdge(ext.x, ext.y, SRX, SRY, uc_community.x, uc_community.y);
            let to = ovalEdge(uc_community.x, uc_community.y, RX, RY, ext.x, ext.y);
            drawDashedArrow(from.x, from.y, to.x, to.y, '<<extends>>');
        });

        // --- extends from Nhận gợi ý AI ---
        const ext_similar = { x: 700, y: 660 };
        const ext_trending = { x: 700, y: 700 };
        drawOval(ext_similar.x, ext_similar.y, SRX, SRY, 'Xem địa điểm\ntương tự (AI)', 11);
        drawOval(ext_trending.x, ext_trending.y, SRX, SRY, 'Xem Trending', 11);

        [ext_similar, ext_trending].forEach(ext => {
            let from = ovalEdge(ext.x, ext.y, SRX, SRY, uc_foryou.x, uc_foryou.y);
            let to = ovalEdge(uc_foryou.x, uc_foryou.y, RX, RY, ext.x, ext.y);
            drawDashedArrow(from.x, from.y, to.x, to.y, '<<extends>>');
        });

        // --- extends from Quản lý địa điểm (Admin) ---
        const ext_approve = { x: 700, y: 870 };
        const ext_crud = { x: 700, y: 910 };
        const ext_cat = { x: 700, y: 950 };
        drawOval(ext_approve.x, ext_approve.y, SRX, SRY, 'Phê duyệt địa điểm', 11);
        drawOval(ext_crud.x, ext_crud.y, SRX, SRY, 'Thêm/Sửa/Xóa\nđịa điểm', 11);
        drawOval(ext_cat.x, ext_cat.y, SRX, SRY, 'Quản lý danh mục', 11);

        [ext_approve, ext_crud, ext_cat].forEach(ext => {
            let from = ovalEdge(ext.x, ext.y, SRX, SRY, uc_mngPlaces.x, uc_mngPlaces.y);
            let to = ovalEdge(uc_mngPlaces.x, uc_mngPlaces.y, RX, RY, ext.x, ext.y);
            drawDashedArrow(from.x, from.y, to.x, to.y, '<<extends>>');
        });

        // --- extends from Quản lý người dùng (Admin) ---
        const ext_suspend = { x: 700, y: 990 };
        const ext_review = { x: 960, y: 990 };
        drawOval(ext_suspend.x, ext_suspend.y, SRX, SRY, 'Khóa/Mở khóa\ntài khoản', 11);
        drawOval(ext_review.x, ext_review.y, SRX, SRY, 'Xóa đánh giá', 11);

        [ext_suspend].forEach(ext => {
            let from = ovalEdge(ext.x, ext.y, SRX, SRY, uc_mngUsers.x, uc_mngUsers.y);
            let to = ovalEdge(uc_mngUsers.x, uc_mngUsers.y, RX, RY, ext.x, ext.y);
            drawDashedArrow(from.x, from.y, to.x, to.y, '<<extends>>');
        });
        {
            let from = ovalEdge(ext_review.x, ext_review.y, SRX, SRY, uc_mngUsers.x, uc_mngUsers.y);
            let to = ovalEdge(uc_mngUsers.x, uc_mngUsers.y, RX, RY, ext_review.x, ext_review.y);
            drawDashedArrow(from.x, from.y, to.x, to.y, '<<extends>>');
        }

        // --- extends from Dashboard (Admin) ---
        const ext_train = { x: 700, y: 810 };
        const ext_stats = { x: 700, y: 770 };
        drawOval(ext_train.x, ext_train.y, SRX, SRY, 'Huấn luyện AI\n(Train GNN)', 11);
        drawOval(ext_stats.x, ext_stats.y, SRX, SRY, 'Xem biểu đồ\nthống kê', 11);

        [ext_train, ext_stats].forEach(ext => {
            let from = ovalEdge(ext.x, ext.y, SRX, SRY, uc_dashboard.x, uc_dashboard.y);
            let to = ovalEdge(uc_dashboard.x, uc_dashboard.y, RX, RY, ext.x, ext.y);
            drawDashedArrow(from.x, from.y, to.x, to.y, '<<extends>>');
        });

        // --- Đường kẻ phân chia vùng Actor ---
        ctx.setLineDash([3, 5]);
        ctx.strokeStyle = '#999';
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(180, 200);
        ctx.lineTo(1170, 200);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(180, 790);
        ctx.lineTo(1170, 790);
        ctx.stroke();
        ctx.setLineDash([]);

        // Labels for zones
        ctx.fillStyle = '#888';
        ctx.font = `italic 11px ${FONT}`;
        ctx.textAlign = 'right';
        ctx.fillText('Vùng Khách vãng lai', 1165, 195);
        ctx.fillText('Vùng Người dùng đã đăng nhập', 1165, 215);
        ctx.fillText('Vùng Quản trị viên (Admin)', 1165, 805);
    }

    draw();

    function downloadPNG() {
        const link = document.createElement('a');
        link.download = 'usecase_full_system_savannakhet.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    }
    </script>
</body>
</html>
