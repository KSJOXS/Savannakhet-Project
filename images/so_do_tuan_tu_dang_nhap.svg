<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" width="800" height="680">
  <!-- Clean background with soft shadow border -->
  <rect width="100%" height="100%" fill="#ffffff" rx="16" filter="url(#shadow)"/>
  
  <defs>
    <!-- Solid arrowhead for synchronous calls -->
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <!-- Open arrowhead for replies -->
    <marker id="open-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 9 5 L 1 8" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    
    <!-- Linear Gradients for Premium Look -->
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="active-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>
  
  <style>
    .actor-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #334155; text-anchor: middle; }
    .header-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .msg-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 550; fill: #1e293b; }
    .msg-text.center { text-anchor: middle; }
    .title-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
  </style>

  <!-- Lifeline Dashed Lines -->
  <line x1="120" y1="95" x2="120" y2="610" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="320" y1="95" x2="320" y2="610" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="520" y1="95" x2="520" y2="610" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="720" y1="95" x2="720" y2="610" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- Actor (Người dùng) Graphic -->
  <g transform="translate(0, 0)">
    <circle cx="120" cy="45" r="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <line x1="120" y1="55" x2="120" y2="78" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <line x1="102" y1="63" x2="138" y2="63" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <line x1="120" y1="78" x2="108" y2="93" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <line x1="120" y1="78" x2="132" y2="93" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <text x="120" y="112" class="actor-text">Người dùng</text>
  </g>

  <!-- Lifeline Header Boxes -->
  <g filter="url(#shadow)">
    <!-- Trang đăng nhập -->
    <rect x="250" y="45" width="140" height="40" rx="8" fill="url(#header-grad)" stroke="#0284c7" stroke-width="1.5"/>
    <text x="320" y="70" class="header-text">Trang đăng nhập</text>
    
    <!-- Đăng nhập -->
    <rect x="450" y="45" width="140" height="40" rx="8" fill="url(#header-grad)" stroke="#0284c7" stroke-width="1.5"/>
    <text x="520" y="70" class="header-text">Đăng nhập</text>
    
    <!-- Database -->
    <rect x="650" y="45" width="140" height="40" rx="8" fill="url(#header-grad)" stroke="#0284c7" stroke-width="1.5"/>
    <text x="720" y="70" class="header-text">Database</text>
  </g>

  <!-- Activation Boxes -->
  <!-- Người dùng activation box 1 -->
  <rect x="113" y="170" width="14" height="60" rx="3" fill="url(#active-grad)" stroke="#0284c7" stroke-width="1.5"/>
  <!-- Trang đăng nhập activation box 1 -->
  <rect x="313" y="130" width="14" height="40" rx="3" fill="url(#active-grad)" stroke="#0284c7" stroke-width="1.5"/>
  
  <!-- Trang đăng nhập activation box 2 -->
  <rect x="313" y="230" width="14" height="50" rx="3" fill="url(#active-grad)" stroke="#0284c7" stroke-width="1.5"/>
  <!-- Đăng nhập activation box -->
  <rect x="513" y="280" width="14" height="210" rx="3" fill="url(#active-grad)" stroke="#0284c7" stroke-width="1.5"/>
  <!-- Database activation box -->
  <rect x="713" y="330" width="14" height="50" rx="3" fill="url(#active-grad)" stroke="#0284c7" stroke-width="1.5"/>

  <!-- Trang đăng nhập activation box 3 -->
  <rect x="313" y="490" width="14" height="60" rx="3" fill="url(#active-grad)" stroke="#0284c7" stroke-width="1.5"/>
  <!-- Người dùng activation box 2 -->
  <rect x="113" y="550" width="14" height="50" rx="3" fill="url(#active-grad)" stroke="#0284c7" stroke-width="1.5"/>

  <!-- Messages & Arrows -->
  
  <!-- 1. Vào trang đăng nhập -->
  <line x1="120" y1="130" x2="311" y2="130" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="215" y="123" class="msg-text center">Vào trang đăng nhập</text>
  
  <!-- 2. Hiển thị trang đăng nhập -->
  <line x1="313" y1="170" x2="129" y2="170" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#open-arrow)"/>
  <text x="215" y="163" class="msg-text center">Hiển thị trang đăng nhập</text>
  
  <!-- 3. Nhập tài khoản -->
  <line x1="127" y1="230" x2="311" y2="230" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="215" y="223" class="msg-text center">Nhập tài khoản</text>
  
  <!-- 4. Xử lý thông tin tài khoản -->
  <line x1="327" y1="280" x2="511" y2="280" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="273" class="msg-text center">Xử lý thông tin tài khoản</text>
  
  <!-- 5. Kiểm tra thông tin -->
  <line x1="527" y1="330" x2="711" y2="330" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="323" class="msg-text center">Kiểm tra thông tin</text>
  
  <!-- 6. Kết quả kiểm tra -->
  <line x1="713" y1="380" x2="529" y2="380" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#open-arrow)"/>
  <text x="620" y="373" class="msg-text center">Kết quả kiểm tra</text>

  <!-- 7. Xác thực / Phân quyền (Self-loop) -->
  <path d="M 527 410 C 560 410, 560 440, 529 440" fill="none" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="565" y="429" class="msg-text">Xác thực / Phân quyền</text>

  <!-- 8. Trả về kết quả -->
  <line x1="513" y1="490" x2="329" y2="490" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#open-arrow)"/>
  <text x="420" y="483" class="msg-text center">Trả về kết quả</text>

  <!-- 9. Thông báo kết quả / Hiển thị bottom tabbar theo quyền -->
  <line x1="313" y1="550" x2="129" y2="550" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#open-arrow)"/>
  <text x="220" y="503" class="msg-text center">Thông báo kết quả</text>
  <text x="220" y="522" class="msg-text center">Hiển thị bottom tabbar</text>
  <text x="220" y="541" class="msg-text center">theo quyền</text>

  <!-- Title/Caption -->
  <text x="400" y="650" class="title-text">Hình 2.3 Sơ đồ tuần tự đăng nhập</text>
</svg>
